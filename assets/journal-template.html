<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#F5F3EF; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#1F1B16; padding:32px 16px; }
  .card { max-width:720px; margin:0 auto; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 2px 24px rgba(31,27,22,.08); }
  .head { background:#DA291C; color:#fff; padding:30px 36px 26px; position:relative; }
  .head::after { content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:#FFC72C; opacity:.22; }
  .badge { display:inline-block; background:#FFC72C; color:#1F1B16; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; margin-bottom:12px; }
  .head h1 { font-size:27px; font-weight:600; letter-spacing:.5px; line-height:1.3; }
  .head p { margin-top:7px; font-size:13px; opacity:.85; }
  .switchbar { display:flex; align-items:center; gap:8px; padding:14px 36px; background:#FFF9E8; border-bottom:1px solid #F3E7C8; }
  .switchbar .lb { font-size:12px; color:#8A7351; margin-right:2px; }
  .sw { font-family:inherit; font-size:12px; padding:6px 14px; border-radius:16px; border:1px solid #E3C46A; background:#fff; color:#8A5A00; cursor:pointer; }
  .sw.on { background:#DA291C; border-color:#DA291C; color:#fff; }
  .body { padding:26px 36px 30px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  .stat { background:#FFF9E8; border-radius:12px; padding:14px 12px; text-align:center; cursor:pointer; border:1px solid transparent; transition:.15s; }
  .stat:hover { border-color:#FFC72C; transform:translateY(-1px); }
  .stat.on { background:#DA291C; }
  .stat.on .n { color:#fff; }
  .stat.on .l { color:#FFE0DC; }
  .stat .n { font-size:24px; font-weight:600; color:#DA291C; line-height:1.2; }
  .stat .n small { font-size:13px; font-weight:500; }
  .stat .l { font-size:11px; color:#7A6F62; margin-top:5px; }
  .detail { display:none; background:#FBF8F2; border:1px dashed #E2D8C6; border-radius:12px; padding:16px 18px; margin-bottom:24px; font-size:12px; }
  .detail.on { display:block; }
  .detail h3 { font-size:12px; font-weight:600; margin-bottom:10px; color:#8A5A00; }
  .detail .row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dotted #E7DFD0; }
  .detail .row:last-child { border-bottom:none; }
  .detail .row span:last-child { color:#7A6F62; }
  .sec { margin-bottom:24px; }
  .sec h2 { font-size:14px; font-weight:600; margin-bottom:12px; padding-left:9px; border-left:3px solid #FFC72C; }
  .kid { background:#FFF4F2; border:1px solid #F7D9D3; border-radius:14px; padding:18px 20px; }
  .kid .row { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px dashed #EFD6D0; }
  .kid .row:last-child { border-bottom:none; }
  .kid .row span:first-child { color:#7A6F62; }
  .kid .row span:last-child { font-weight:600; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tag { font-size:12px; padding:6px 12px; border-radius:16px; background:#FFF0C2; color:#8A5A00; }
  .bar { margin-bottom:11px; }
  .bar .t { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
  .bar .t span:last-child { color:#7A6F62; }
  .bar .track { height:7px; background:#F0ECE5; border-radius:4px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:4px; }
  .months { display:flex; align-items:flex-end; gap:6px; height:88px; }
  .months .m { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer; }
  .months .m i { display:block; width:100%; background:#FFC72C; border-radius:4px 4px 0 0; min-height:3px; transition:.15s; }
  .months .m:hover i { background:#E8A800; }
  .months .m.now b { color:#1F1B16; font-weight:600; }
  .months .m b { font-size:10px; color:#9A8F82; margin-top:6px; font-weight:400; }
  .insight { background:#FFF9E8; border-radius:14px; padding:6px 18px; }
  .insight .li { display:flex; gap:10px; padding:11px 0; border-bottom:1px dashed #EFE2C4; font-size:13px; line-height:1.6; }
  .insight .li:last-child { border-bottom:none; }
  .insight .li i { font-style:normal; color:#DA291C; font-weight:600; flex-shrink:0; }
  .pair { display:flex; flex-direction:column; gap:8px; }
  .pair .p { background:#FBF8F2; border-radius:10px; padding:10px 14px; font-size:13px; display:flex; justify-content:space-between; }
  .pair .p span:last-child { color:#9A8F82; font-size:12px; }
  .empty { background:#F7F5F1; border-radius:12px; padding:22px; text-align:center; font-size:13px; color:#7A6F62; }
  .foot { border-top:1px solid #F0ECE5; padding:16px 36px 20px; display:flex; justify-content:space-between; font-size:11px; color:#9A8F82; }

  .picker { position:fixed; inset:0; background:#F5F3EF; display:none; align-items:center; justify-content:center; z-index:9; }
  .picker.on { display:flex; }
  .picker .box { text-align:center; max-width:600px; padding:24px; }
  .picker h2 { font-size:20px; font-weight:600; margin-bottom:6px; }
  .picker .sub { font-size:13px; color:#7A6F62; margin-bottom:26px; }
  .picker .opts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .picker .opt { background:#fff; border:2px solid transparent; border-radius:16px; padding:26px 20px; cursor:pointer; transition:.15s; box-shadow:0 2px 16px rgba(31,27,22,.06); }
  .picker .opt:hover { border-color:#DA291C; transform:translateY(-2px); }
  .picker .opt .em { font-size:30px; font-weight:600; color:#DA291C; margin-bottom:10px; }
  .picker .opt .tt { font-size:15px; font-weight:600; margin-bottom:6px; }
  .picker .opt .ds { font-size:12px; color:#7A6F62; line-height:1.6; }
</style>
</head>
<body>
<div class="picker" id="picker">
  <div class="box">
    <h2>想看哪一种档案？</h2>
    <div class="sub">选一个视角，随时可以在页面顶部切换</div>
    <div class="opts">
      <div class="opt" data-pick="personal">
        <div class="em">1</div>
        <div class="tt">个人版</div>
        <div class="ds">看自己的口味偏好、消费习惯<br>和一个人的麦当劳轨迹</div>
      </div>
      <div class="opt" data-pick="family">
        <div class="em">2+</div>
        <div class="tt">家庭版</div>
        <div class="ds">看一家人的口味画像<br>有儿童餐订单时长出娃的成长册</div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="head">
    <div class="badge" id="badge">{{BADGE}}</div>
    <h1 id="title">{{TITLE}}</h1>
    <p id="subtitle">{{SUBTITLE}}</p>
  </div>
  <div class="switchbar">
    <span class="lb">档案视角</span>
    <button class="sw" data-mode="personal">个人版</button>
    <button class="sw" data-mode="family">家庭版</button>
  </div>
  <div class="body">
    <div class="stats">{{STATS}}</div>
    <div class="detail" id="detail"></div>
    <div id="view">{{VIEW_DEFAULT}}</div>
  </div>
  <div class="foot">
    <span>{{FOOT_NOTE}}</span>
    <span>{{FOOT_TIME}}</span>
  </div>
</div>
<script>
var MODES = {{MODE_JSON}};
var VIEWS = {{VIEWS_JSON}};
var DETAILS = {{DETAILS_JSON}};
var AUTO_PICK = {{AUTO_PICK}};
var current = "";

function setMode(mode) {
  document.getElementById("badge").textContent = MODES[mode].badge;
  document.getElementById("title").textContent = MODES[mode].title;
  document.getElementById("view").innerHTML = VIEWS[mode];
  var first = document.querySelector(".stat .l");
  if (first) first.textContent = MODES[mode].firstStat;
  var btns = document.querySelectorAll(".sw");
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].getAttribute("data-mode") === mode ? "sw on" : "sw";
  }
}

function paintCards(key) {
  var cards = document.querySelectorAll(".stat");
  for (var i = 0; i < cards.length; i++) {
    cards[i].className = cards[i].getAttribute("data-key") === key ? "stat on" : "stat";
  }
}

function showDetail(key) {
  var box = document.getElementById("detail");
  if (current === key) {
    box.className = "detail";
    current = "";
    paintCards("");
    return;
  }
  box.innerHTML = DETAILS[key];
  box.className = "detail on";
  current = key;
  paintCards(key);
}

function closePicker(mode) {
  document.getElementById("picker").className = "picker";
  setMode(mode);
}

var cards = document.querySelectorAll(".stat");
for (var i = 0; i < cards.length; i++) {
  cards[i].addEventListener("click", function () {
    showDetail(this.getAttribute("data-key"));
  });
}
var btns = document.querySelectorAll(".sw");
for (var i = 0; i < btns.length; i++) {
  btns[i].addEventListener("click", function () {
    setMode(this.getAttribute("data-mode"));
  });
}
var opts = document.querySelectorAll(".opt");
for (var i = 0; i < opts.length; i++) {
  opts[i].addEventListener("click", function () {
    closePicker(this.getAttribute("data-pick"));
  });
}

if (AUTO_PICK) {
  document.getElementById("picker").className = "picker on";
} else {
  setMode("{{DEFAULT_MODE}}");
}
</script>
</body>
</html>
